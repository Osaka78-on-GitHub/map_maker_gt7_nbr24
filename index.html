<!DOCTYPE html>
<html>
<head>
  <title>Map Maker GT7 NBR24</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.14.1/dist/leaflet-geoman.css">
  <style>
    body { margin: 0; display: flex; height: 100vh; }
    #map1, #map2 { flex: 1; }
    #toolbar {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: #fff; padding: 6px 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.3); display: flex; gap: 8px;
    }
    #toolbar button { padding: 6px 14px; cursor: pointer; }
  </style>
</head>
<body>
<div id="map1"></div>
<div id="map2"></div>
<div id="toolbar">
  <button onclick="exportGeoJSON()">Export GeoJSON</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.14.1/dist/leaflet-geoman.min.js"></script>
<script>
// --- Dual map setup ---
const center = [50.33323, 6.94309];
const zoom = 15;
const STORAGE_KEY = 'nbr_map_data';

const map1 = L.map('map1').setView(center, zoom, { maxZoom: 24 });
const map2 = L.map('map2').setView(center, zoom, { maxZoom: 24 });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 24, attribution: '© OSM'
}).addTo(map1);

L.tileLayer.wms('https://geo4.service24.rlp.de/wms/rp_dop20.fcgi', {
  layers: 'rp_dop20', format: 'image/jpeg',
  maxZoom: 24, maxNativeZoom: 18, attribution: '© RLP DOP20'
}).addTo(map2);

// Sync
let syncing = false;
function sync(from, to) {
  if (syncing) return;
  syncing = true;
  to.setView(from.getCenter(), from.getZoom(), { animate: false });
  syncing = false;
}
map1.on('move', () => sync(map1, map2));
map2.on('move', () => sync(map2, map1));

// --- Geoman ---
map2.pm.addControls({ position: 'topleft' });

// --- Load saved data ---
const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
const loadedLayers = [];

saved.forEach(item => {
  let layer;
  if (item.geometry.type === 'Point') {
    layer = L.marker([item.geometry.coordinates[1], item.geometry.coordinates[0]]);
  } else if (item.geometry.type === 'LineString') {
    layer = L.polyline(item.geometry.coordinates.map(c => [c[1], c[0]]));
  } else if (item.geometry.type === 'Polygon') {
    layer = L.polygon(item.geometry.coordinates[0].map(c => [c[1], c[0]]));
  }
  if (layer) {
    Object.assign(layer.options, item.properties);
    layer.addTo(map2);
    loadedLayers.push(layer);
  }
});
  
// --- Save on every change ---
function save() {
  const layers = map2.pm.getGeomanLayers();
  const data = layers.map(layer => {
    let geometry;
    if (layer instanceof L.Polygon) {
      geometry = { type: 'Polygon', coordinates: [layer.getLatLngs()[0].map(p => [p.lng, p.lat])] };
    } else if (layer instanceof L.Polyline) {
      geometry = { type: 'LineString', coordinates: layer.getLatLngs().map(p => [p.lng, p.lat]) };
    } else if (layer instanceof L.Marker) {
      const ll = layer.getLatLng();
      geometry = { type: 'Point', coordinates: [ll.lng, ll.lat] };
    }
    const props = {};
    Object.keys(layer.options).forEach(k => {
      if (typeof layer.options[k] === 'string') props[k] = layer.options[k];
    });
    return { type: 'Feature', properties: props, geometry };
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}   

map2.on('pm:create', (e) => {
   const input = prompt('Tags (one per line, key=value):\n\nname=Kesselchen\ncamera=7\nbraking=yes') || '';
  input.split('\n').forEach(line => {
    const idx = line.indexOf('=');
    if (idx > 0) {
      e.layer.options[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
    }
  });
  save();
});
map2.on('pm:selectionchanged', (e) => {
  if (e.layers.length === 1) {
    const layer = e.layers[0];
    const current = Object.entries(layer.options)
      .filter(([k, v]) => typeof v === 'string' && v)
      .map(([k, v]) => `${k}=${v}`)
      .join('\n');

    const input = prompt('Edit tags (key=value, one per line):\n\n' + (current || '(empty)'));
    if (input === null) return; // cancelled

    // Clear old string props
    Object.keys(layer.options).forEach(k => {
      if (typeof layer.options[k] === 'string') delete layer.options[k];
    });

    // Set new ones
    input.split('\n').forEach(line => {
      const idx = line.indexOf('=');
      if (idx > 0) {
        layer.options[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
      }
    });
    save();
  }
});
map2.on('pm:edit', save);
map2.on('pm:remove', save);
map2.on('pm:cut', save);

// --- Export (backup/share) ---
function exportGeoJSON() {
  const layers = map2.pm.getGeomanLayers();
  const features = layers.map(layer => {
    let geometry;
    if (layer instanceof L.Polygon) {
      geometry = { type: 'Polygon', coordinates: [layer.getLatLngs()[0].map(p => [p.lng, p.lat])] };
    } else if (layer instanceof L.Polyline) {
      geometry = { type: 'LineString', coordinates: layer.getLatLngs().map(p => [p.lng, p.lat]) };
    } else if (layer instanceof L.Marker) {
      const ll = layer.getLatLng();
      geometry = { type: 'Point', coordinates: [ll.lng, ll.lat] };
    }
    const props = {};
    Object.keys(layer.options).forEach(k => {
      if (typeof layer.options[k] === 'string') props[k] = layer.options[k];
    });
    return { type: 'Feature', properties: props, geometry };
  });
  const geojson = { type: 'FeatureCollection', features };
  const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/geo+json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nbr_map.geojson';
  a.click();
}  
</script>
</body>
</html>
