<!DOCTYPE html>
<html>
 <style>
    body { background: #000; color: #fff; font-family: monospace; padding: 20px; }
    h2 { color: #fff; }
    input, button { background: #222; color: #fff; border: 1px solid #555; padding: 4px 8px; }
    button { cursor: pointer; }
    hr { border-color: #333; }
    #log { white-space: pre-wrap; color: #0f0; }
    #msgs div { color: #0ff; }
    label { color: #fff; }
  </style>
<head><title>GT7 WebRTC Test</title></head>
<body>
  <h2>WebRTC Signaling Test</h2>
  <label>Room: <input id="room" value="websocket" style="width:80px"></label>
  <button id="go">Connect</button>
  <hr>
  <div id="log" style="font-family:monospace;white-space:pre-wrap"></div>
  <hr>
  <input id="msg" placeholder="Type a message..." style="width:200px">
  <button id="send">Send</button>
  <div id="msgs" style="margin-top:12px;font-family:monospace"></div>

<script>
const WORKER = "map-maker-gt7-nbr24.osaka78.workers.dev";
let ws;

function log(s) { document.getElementById("log").textContent += s + "\n"; }

document.getElementById("go").onclick = () => {
  const room = document.getElementById("room").value;
  log(`Connecting to wss://${WORKER}/${room}`);
  ws = new WebSocket(`wss://${WORKER}/${room}`);

  ws.onopen = () => log("WS connected.");

  ws.onmessage = (e) => {
    document.getElementById("msgs").innerHTML += `<div>← ${e.data}</div>`;
  };

  ws.onclose = () => log("WS closed.");
  ws.onerror = () => log("WS error.");
};

document.getElementById("send").onclick = () => {
  const text = document.getElementById("msg").value;
  ws.send(text);
  document.getElementById("msgs").innerHTML += `<div>→ ${text}</div>`;
  document.getElementById("msg").value = "";
};
  
</script>
</body>
</html>
